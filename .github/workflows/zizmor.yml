name: zizmor

on:
  push:
    branches:
      - main
  pull_request:
permissions: {}
jobs:
  zizmor:
    permissions:
      security-events: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.0
        with:
          advanced-security: false
