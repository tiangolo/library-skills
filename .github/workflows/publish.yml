name: Publish

on:
  release:
    types:
      - published

jobs:
  check-release:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: ".python-version"
      - name: Check release versions
        run: python scripts/check_release_versions.py

  publish-python:
    permissions:
      id-token: write
      contents: read
    needs:
      - check-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: ".python-version"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "latest-known"
          enable-cache: false
      - name: Build Python distribution
        run: uv build
      - name: Publish Python package
        run: uv publish

  publish-typescript:
    permissions:
      id-token: write
      contents: read
    needs:
      - check-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm dependencies
        run: npm ci
      - name: Build TypeScript distribution
        run: npm run build
      - name: Publish TypeScript package
        run: npm publish
